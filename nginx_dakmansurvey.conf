# Cấu hình Nginx Reverse Proxy cho Webapp Khảo Sát Dakman
# Tên miền: dakmansurvey.slowforest.vn
# File đặt tại: /etc/nginx/sites-available/dakmansurvey.slowforest.vn

server {
    listen 80;
    listen [::]:80;
    server_name dakmansurvey.slowforest.vn;

    # Tự động chuyển hướng HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dakmansurvey.slowforest.vn;

    # Chứng chỉ SSL (Tự động sinh bởi Certbot: certbot --nginx -d dakmansurvey.slowforest.vn)
    ssl_certificate /etc/letsencrypt/live/dakmansurvey.slowforest.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dakmansurvey.slowforest.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Giao thức bảo mật & Caching
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Giới hạn kích thước tải lên (phiếu khảo sát có thể kèm ảnh/file nếu mở rộng)
    client_max_body_size 50M;

    # Nén Gzip tăng tốc độ tải trang trên di động 3G/4G
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Proxy tới dịch vụ Backend Python Web Server (Chạy ở cổng 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Nhật ký truy cập & lỗi
    access_log /var/log/nginx/dakmansurvey_access.log;
    error_log /var/log/nginx/dakmansurvey_error.log;
}

